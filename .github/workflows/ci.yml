name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: install the checkers
        run: pip install ruff mypy

      - name: lint
        run: ruff check .

      - name: format
        run: ruff format --check .

      - name: types
        run: mypy .

  test:
    name: tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: install coverage
        run: pip install coverage

      - name: every test
        run: |
          for t in *.test.py tools/*.test.py; do
            echo "--- $t"
            python3 "$t" || exit 1
          done

      - name: coverage, which fails below 100 percent
        run: |
          python3 -m coverage erase
          for t in *.test.py tools/*.test.py; do
            case "$t" in *.retail.test.py) continue;; esac
            python3 -m coverage run -a "$t" >/dev/null
          done
          python3 -m coverage report

  doctor:
    name: the doctor runs on a machine with nothing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: it reports rather than throwing
        run: |
          python3 doctor.py || true
          python3 -c "
          import doctor
          found = doctor.examine()
          assert found, 'the doctor examined nothing, which is not a clean run'
          print(f'{len(found)} checks reported')
          "

      - name: no dump and no microcode are here, and the suite still runs green
        run: |
          test ! -d roms || test -z "$(ls -A roms)"
          test ! -d firmware || test -z "$(ls -A firmware)"
          for t in *.test.py tools/*.test.py; do
            python3 "$t" || exit 1
          done

  formatting:
    name: json and yaml formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4

      - name: install
        run: pnpm install --frozen-lockfile

      - name: check
        run: pnpm run format:check

  workflows:
    name: workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: actionlint
        uses: raven-actions/actionlint@v2

      - name: shellcheck
        run: shellcheck --severity=style --shell=bash scripts/*.sh
